<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VH FB Cleaner</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="VH FB Cleaner" class="logo" />
        <div class="brand-text">
          <div class="title-row">
            <h1>VH FB Cleaner</h1>
            <span class="ver-tag">v2.0</span>
          </div>
          <p id="subtitleText" class="subtitle"></p>
        </div>
      </div>

      <div class="header-right">
        <div class="lang-switch" role="group" aria-label="Language">
          <button id="langEnBtn" class="lang-btn active" type="button">EN</button>
          <button id="langKmBtn" class="lang-btn" type="button">ខ្មែរ</button>
        </div>
        <span id="statusBadge" class="status-badge idle"></span>
      </div>
    </header>

    <div id="notFbWarning" class="alert hidden"></div>

    <section class="stats-card">
      <div class="stats-grid">
        <div class="stat-box success">
          <span id="statDeletedLabel" class="stat-label"></span>
          <strong id="deletedCount" class="stat-value">0</strong>
        </div>
        <div class="stat-box warn">
          <span id="statSkippedLabel" class="stat-label"></span>
          <strong id="skippedCount" class="stat-value">0</strong>
        </div>
        <div class="stat-box danger">
          <span id="statErrorLabel" class="stat-label"></span>
          <strong id="errorCount" class="stat-value">0</strong>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="progressLabel" class="progress-label"></span>
          <span id="progressText" class="progress-text">0</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-fill"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="section-label" id="modeSectionLabel"></div>
      <div class="mode-tabs" role="tablist">
        <button class="mode-btn active" data-mode="remove_all" type="button" id="modeRemoveAll"></button>
        <button class="mode-btn" data-mode="bin_only" type="button" id="modeBinOnly"></button>
        <button class="mode-btn" data-mode="archive_only" type="button" id="modeArchiveOnly"></button>
      </div>

      <div class="field">
        <div class="field-top">
          <label for="limitInput" id="limitLabel"></label>
          <div class="preset-group">
            <button type="button" class="preset-btn active" data-limit="0" id="presetAll"></button>
            <button type="button" class="preset-btn" data-limit="50">50</button>
            <button type="button" class="preset-btn" data-limit="100">100</button>
            <button type="button" class="preset-btn" data-limit="500">500</button>
          </div>
        </div>
        <input id="limitInput" type="number" min="0" step="1" value="0" />
      </div>

      <div class="row-two">
        <div class="field">
          <label for="delayInput" id="delayLabel"></label>
          <input id="delayInput" type="number" min="1" max="30" step="0.5" value="2.5" />
        </div>
        <label class="switch-card" for="autoScrollInput">
          <span id="autoScrollLabel"></span>
          <input id="autoScrollInput" type="checkbox" checked />
        </label>
      </div>
    </section>

    <section class="controls">
      <button id="startBtn" class="btn btn-primary" type="button"></button>
      <div class="controls-row">
        <button id="pauseBtn" class="btn btn-warning" type="button" disabled></button>
        <button id="stopBtn" class="btn btn-danger" type="button" disabled></button>
        <button id="resetBtn" class="btn btn-ghost" type="button"></button>
      </div>
    </section>

    <section class="log-card">
      <div class="log-header">
        <span id="logHeaderLabel"></span>
        <span id="modeIndicator" class="mode-pill"></span>
      </div>
      <div id="logList" class="log-list"></div>
    </section>

    <footer class="footer-bar">
      <div class="footer-meta-row">
        <a
          id="adminLink"
          class="meta-pill admin-badge"
          href="https://t.me/vh_digital"
          target="_blank"
          rel="noopener noreferrer"
          title="Telegram Admin: @vh_digital"
        >
          <svg viewBox="0 0 24 24" class="meta-icon admin-icon" aria-hidden="true">
            <path fill="currentColor" d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm-1.1 13.4l-3.3-3.3 1.4-1.4 1.9 1.9 4.5-4.5 1.4 1.4-5.9 5.9z"/>
          </svg>
          <span id="adminPrefixText" class="admin-prefix">Admin:</span>
          <strong class="admin-name">VH Digital</strong>
        </a>
        <div class="social-links">
          <a
            id="fbPageLink"
            class="meta-pill fb-link"
            href="https://www.facebook.com/vhdigitalkh"
            target="_blank"
            rel="noopener noreferrer"
            title="Facebook: VH Digital"
          >
            <svg viewBox="0 0 24 24" class="meta-icon" aria-hidden="true">
              <path fill="currentColor" d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/>
            </svg>
            <span id="fbPageLinkText">Facebook</span>
          </a>
          <a
            id="channelLink"
            class="meta-pill channel-link"
            href="https://t.me/vhdigitalchannel"
            target="_blank"
            rel="noopener noreferrer"
            title="Telegram: VH Digital Channel"
          >
            <svg viewBox="0 0 24 24" class="meta-icon" aria-hidden="true">
              <path fill="currentColor" d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
            </svg>
            <span id="channelLinkText">Channel</span>
          </a>
        </div>
      </div>
      <span id="footerNote" class="footer-note"></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
